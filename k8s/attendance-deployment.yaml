apiVersion: apps/v1
kind: Deployment
metadata:
  name: attendance-service
  namespace: student-attendance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attendance-service
  template:
    metadata:
      labels:
        app: attendance-service
    spec:
      containers:
        - name: attendance-service
          image: sreyleap/attendance-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5004