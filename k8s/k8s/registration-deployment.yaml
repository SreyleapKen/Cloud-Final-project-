apiVersion: apps/v1
kind: Deployment
metadata:
  name: registration-service
  namespace: student-attendance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registration-service
  template:
    metadata:
      labels:
        app: registration-service
    spec:
      containers:
        - name: registration-service
          image: sreyleap/student-registration:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
