
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: student-attendance-ingress
  namespace: student-attendance
spec:
  ingressClassName: nginx
  rules:
    - host: aupp.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 5000

