apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-service
  namespace: student-attendance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-service
  template:
    metadata:
      labels:
        app: student-service
    spec:
      containers:
        - name: student-service
          image: sreyleap/student-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5003
